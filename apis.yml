name: Adphorus
description: Adphorus was an Istanbul- and Berlin-based travel marketing-science company and an official
  Facebook and Instagram Marketing Partner (certified since 2014) that specialized in automated, scalable
  Dynamic Ads for Travel, helping brands such as Expedia, Trivago, and Kayak scale full-funnel performance
  on Facebook and Instagram. The company was acquired by Sojern in November 2017 and subsequently absorbed;
  it operates no independent public website or developer API today, so this network profile is retained as
  a historical/portfolio record rather than an active API provider. The enrichment pipeline found no live
  domain, developer portal, or specification to harvest.
